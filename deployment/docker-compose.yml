# OpenSearch for court-search. Paths and sizes come from deployment/.env (not committed),
# see deployment/env.example. Defaults keep everything under the repo's data/ directory.
services:
  opensearch:
    build:
      context: ./opensearch
      dockerfile: Dockerfile
    image: court-search-opensearch:3.8.0-uk
    environment:
      - cluster.name=court-search
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-12g} -Xmx${OPENSEARCH_HEAP:-12g}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-CourtSearch_ChangeMe_1}
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - path.repo=/usr/share/opensearch/snapshots
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ${OPENSEARCH_DATA:-../data/opensearch}:/usr/share/opensearch/data
      - ${OPENSEARCH_SNAPSHOTS:-../data/snapshots}:/usr/share/opensearch/snapshots
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-20g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
