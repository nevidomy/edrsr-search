[project]
name = "court-search"
version = "0.1.0"
description = "Ukrainian court decision search API and MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "httpx>=0.28,<1",
  "pyarrow>=20,<23",
  "opensearch-py>=3.0,<4",
  "mcp>=2.2,<3",
  "typer>=0.16,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
court-search = "court_search.cli.main:app"
court-search-mcp = "court_search.mcp.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
